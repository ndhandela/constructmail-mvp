<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0E1B2C" />
  <title>POMAR — Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FAF7F2;
      color: #0E1B2C;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card { max-width: 360px; }
    .ring {
      width: 64px;
      height: 64px;
      margin: 0 auto 24px;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px;
    }
    p {
      font-size: 15px;
      color: #475569;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    button {
      background: #0E1B2C;
      color: #FAF7F2;
      border: none;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 6px;
      min-height: 44px;
      cursor: pointer;
    }
    button:active { background: #15263D; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="ring" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g transform="translate(50,50)">
        <circle r="38.16" fill="none" stroke="#0E1B2C" stroke-width="11.69" />
        <circle r="16.07" fill="none" stroke="#D97706" stroke-width="5.84" />
        <circle r="8.47" fill="#D97706" />
      </g>
    </svg>
    <h1>You're offline</h1>
    <p>This page needs a connection and hasn't been saved for offline use yet. Reconnect and try again.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
