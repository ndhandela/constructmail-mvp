<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1B2C" />

    <!-- PWA / "installable mobile app" support — iOS Safari doesn't read
         manifest.json for install behavior, so these Apple-specific tags
         are required in addition to the manifest (see
         src/serviceWorkerRegistration.js and src/components/InstallPrompt.js
         for the rest of the PWA wiring). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="POMAR" />

    <!-- Poppins: brand typeface (the POMAR wordmark's letterforms are baked
         from Poppins Bold, see components/PomarLogo.js) — used for the
         app-shell nav (header/sidebar/tile grid/edit pages). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph (LinkedIn, Slack, FB) -->
    <meta property="og:title" content="POMAR — Intelligence Infrastructure for General Contractors" />
    <meta property="og:description" content="Turn scattered project data into decisions you can act on. Start with ConstructMail — free." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://pomar.ai" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="POMAR — Intelligence Infrastructure for General Contractors" />
    <meta name="twitter:description" content="Turn scattered project data into decisions you can act on. Start with ConstructMail — free." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <!-- No static <title> or <meta name="description"> here on purpose —
         each public page renders its own (React 19 hoists <title>/<meta>/
         <link> tags from anywhere in the tree to <head> automatically),
         and App.js renders a site-wide default for every other route. Two
         of them rendered at once don't get deduped against each other, so
         a static tag here would sit alongside the real one as a permanent
         duplicate instead of being overridden by it — see PUBLIC_SEO_PATHS
         in src/App.js. -->
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
